        <section>
            <form>
                <div>
                    <h2>Create an Account</h2>
                    <p>Please create an account to get started</p>
                    <hr>

                    <label for="email"><b>Email:</b></label><br>
                    <input type="email" placeholder="Enter email" id="email" name="email" required><br>

                    <label for="pwd"><b>Password:</b></label><br>
                    <input type="password" placeholder="Enter password" id="pwd" name="password" required><br>

                    <label for="pwd-repeat"><b>Repeat Password:</b></label><br>
                    <input type="password" placeholder="Repeat password" id="pwd-repeat" name="password-repeat" required><br>

                    <button type="submit" class="register-button">Register</button>
                </div>
            </form>
        </section>
